name: build-auto

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-auto:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        build_type: [RelWithDebInfo, Debug]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - uses: aseprite/get-ninja@main

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Building
        shell: bash
        run: |
          bash build.sh --auto --norun

      - name: Running CLI Tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]] ; then
            export XVFB=xvfb-run
          fi
          export ASEPRITE=$PWD/build/bin/aseprite
          cd tests
          $XVFB bash run-tests.sh
          
      - name: Bundle Executable Files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release-bundle
          cp build/bin/aseprite.exe release-bundle/
          cp -r build/bin/data release-bundle/
          tar -czf aseprite-windows-${{ matrix.build_type }}.tar.gz release-bundle

      - name: Bundle Executable Files (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-bundle
          cp build/bin/aseprite release-bundle/
          cp -r build/bin/data release-bundle/
          tar -czf aseprite-${{ matrix.os }}-${{ matrix.build_type }}.tar.gz release-bundle

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ matrix.os }}-${{ matrix.build_type }}
          path: "*.tar.gz"
